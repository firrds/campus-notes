# Publishes the convenience image used in the first Docker exercise of the
# course. Participants do not need this workflow, and do not need to read it.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - the Docker Hub account that owns the namespace
#   DOCKERHUB_TOKEN     - a Docker Hub access token with Read/Write scope
#
# The image is deliberately insecure. Its Docker Hub description must say so.

name: Publish image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'seed/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The image must not be published unless the application still starts and
      # its smoke test passes. The deliberate vulnerabilities are the point of
      # this image; a broken build is not.
      - name: Install and smoke-test
        run: |
          npm ci
          npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-notes:seed
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-notes:latest


# The Docker Hub description is NOT set from here.
#
# Docker Hub refuses metadata edits from the same access token that is allowed
# to push images: the PATCH returns 403 Forbidden while the push succeeds.
# Editing the description needs a higher-privilege credential, and putting one
# in CI to rewrite a paragraph is a bad trade.
#
# The description text lives at .github/DOCKERHUB.md and is pasted by hand into
# https://hub.docker.com/repository/docker/<namespace>/campus-notes/general
# whenever it changes. It carries the warning that this image is deliberately
# insecure, which matters more than automating it.
