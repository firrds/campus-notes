services:
  # --- Activity 8: the application behind a reverse proxy ---
  campus-notes:
    image: 192.168.3.10:5000/devops-01/campus-notes:v1.0.0
    container_name: campus-notes
    restart: unless-stopped
    expose: ["3000"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET before starting}
    volumes:
      - notes-data:/data          # the SQLite file. Act. 9 proves this survives.

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      campus-notes:
        condition: service_healthy

  # --- Activity 9, part two: the PTG's own MongoDB procedure, unchanged ---
  mongodb:
    image: mongo:8
    container_name: mongodb-container
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

volumes:
  notes-data:
  mongo-data:
